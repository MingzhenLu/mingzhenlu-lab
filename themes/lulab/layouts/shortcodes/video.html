{{- /* {{< video src="/video/x.mp4" >}}: inline player (metadata only until played), controls bar under the picture via js/player.js. poster= defaults to the page's `poster` front matter */ -}}
{{- $src := .Get "src" -}}
{{- $poster := .Get "poster" | default .Page.Params.poster -}}
<div class="vplayer" data-vplayer>
  <video controls preload="metadata" playsinline{{ with $poster }} poster="{{ . | relURL }}"{{ end }}>
    <source src="{{ $src | relURL }}" type="video/mp4">
    Your browser cannot play this video. <a href="{{ $src | relURL }}">Download it</a>.
  </video>
  <button class="vbig" type="button" aria-label="Play video"></button>
  <div class="vbar">
    <button class="vbtn vplay" type="button" aria-label="Play">
      <svg class="ic ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <span class="vtime">0:00 / 0:00</span>
    <input class="vseek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <button class="vbtn vmute" type="button" aria-label="Mute">
      <svg class="ic ic-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg class="ic ic-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zM15 9.4 16.4 8l2.1 2.1L20.6 8 22 9.4l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1L15 13.6l2.1-2.1z"/></svg>
    </button>
    <button class="vbtn vfs" type="button" aria-label="Fullscreen">
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg>
    </button>
  </div>
</div>
