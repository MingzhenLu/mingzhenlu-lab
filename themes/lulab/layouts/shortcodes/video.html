{{- /* {{< video src="/video/x.mp4" >}}: inline player, loads only metadata until played. poster= defaults to the page's `poster` front matter */ -}}
{{- $src := .Get "src" -}}
{{- $poster := .Get "poster" | default .Page.Params.poster -}}
<div class="video-wrap">
  <video controls preload="metadata" playsinline{{ with $poster }} poster="{{ . | relURL }}"{{ end }}>
    <source src="{{ $src | relURL }}" type="video/mp4">
    Your browser cannot play this video. <a href="{{ $src | relURL }}">Download it</a>.
  </video>
</div>
