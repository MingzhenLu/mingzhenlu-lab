{{ define "main" }}
<article class="page-body">
  <div class="page-inner">
    {{/* front matter `lower: true` keeps the title's own casing (e.g. "hmm... 🤔") */}}
    <h1 class="page-title{{ if .Params.lower }} lower{{ end }}">{{ if .Params.lower }}{{ .Title }}{{ else }}{{ .Title | upper }}{{ end }}</h1>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
